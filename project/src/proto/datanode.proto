syntax = "proto3";

package datanode_proto;

// The greeting service definition.
service datanodeService {
  // Sends a greeting
  rpc checkalive (CheckaliveCMD) returns (RequestResult);
  // set
  rpc handleSet(SetInfo) returns(RequestResult);
  // append
  rpc handleAppend(AppendInfo) returns(RequestResult);
  // merge parity
  rpc handleMergeParity(MergeParityInfo) returns(RequestResult);
  // merge parity with rep
  rpc handleMergeParityWithRep(MergeParityInfo) returns(RequestResult);
  // recovery
  rpc handleRecovery(MergeParityInfo) returns(RequestResult);
  rpc handleRecoveryBreakdown(MergeParityInfo) returns(RequestResult);
  // get
  rpc handleGet(GetInfo) returns(RequestResult);
  rpc handleGetBreakdown(GetInfo) returns(RequestResult);
  // CoRD：块内区间读/写；Δ 暂存文件
  rpc handleCordRangeRead(CordRangeRWInfo) returns(RequestResult);
  rpc handleCordRangeWrite(CordRangeRWInfo) returns(RequestResult);
  rpc handleCordDeltaBlob(CordDeltaBlobInfo) returns(RequestResult);
  // StripeUpdate：校验块侧日志
  rpc handleParityLogAppend(ParityLogAppendInfo) returns(ParityLogAppendReply);
  rpc handleParityLogStoreD0(ParityLogStoreD0Info) returns(RequestResult);
  rpc handleParityLogClearStripe(ParityLogClearStripeInfo) returns(RequestResult);
  rpc handleParityLogMergeIfFull(ParityLogMergeIfFullInfo) returns(RequestResult);
  // delete
  rpc handleDelete(DelInfo) returns(RequestResult);
}

// The request message containing the user's name.
message CheckaliveCMD {
    string name = 1;
}
  
// The response message containing the greetings
message RequestResult {
    bool message = 1;
    int32 valuesizebytes = 2;
    double disk_io_start_time = 3;
    double disk_io_end_time = 4;
    double grpc_start_time = 5;
    /** CoRD TCP 数据通道配对 tag：proxy 连接后先发 tag(u64 BE)，datanode 单 acceptor 多并发连接时防错配 */
    uint64 cord_tcp_xfer_tag = 6;
}

message SetInfo {
    string block_key = 1;
    int32 block_size = 2;
    int32 block_id = 3;
    string proxy_ip = 4;
    int32 proxy_port = 5;
    bool ispull = 6;
}

message AppendInfo {
    string block_key = 1;
    int32 block_id = 2;
    int32 append_size = 3;
    int32 append_offset = 4;
    bool is_serialized = 5;
}

message MergeParityInfo {
    string block_key = 1;
    int32 block_id = 2;
}

message GetInfo {
    string block_key = 1;
    int32 block_size = 2;
    int32 block_id = 3;
    string proxy_ip = 4;
    int32 proxy_port = 5;
}

message CordRangeRWInfo {
    string block_key = 1;
    int32 block_id = 2;
    int32 range_offset = 3;
    int32 range_length = 4;
    string proxy_ip = 5;
    int32 proxy_port = 6;
}

message CordDeltaBlobInfo {
    string blob_key = 1;
    int32 byte_length = 2;
    string proxy_ip = 3;
    int32 proxy_port = 4;
}

message ParityLogAppendInfo {
    int32 stripe_id = 1;
    int32 parity_block_id = 2;
    string parity_block_key = 3;
    int32 data_block_id = 4;
    int32 range_offset = 5;
    int32 range_length = 6;
    int32 k = 7;
    int32 r = 8;
    int32 z = 9;
    int32 block_size = 10;
    string code_type = 11;
    bytes new_data = 12;
}

message ParityLogAppendReply {
    bool ok = 1;
    bool need_d0 = 2;
}

message ParityLogStoreD0Info {
    int32 stripe_id = 1;
    int32 parity_block_id = 2;
    int32 data_block_id = 3;
    int32 range_offset = 4;
    int32 range_length = 5;
    bytes d0 = 6;
}

message ParityLogClearStripeInfo {
    int32 stripe_id = 1;
    int32 parity_begin = 2;
    int32 parity_end = 3;
}

message ParityLogMergeIfFullInfo {
    int32 stripe_id = 1;
    int32 parity_block_id = 2;
    string parity_block_key = 3;
    int32 k = 4;
    int32 r = 5;
    int32 z = 6;
    int32 block_size = 7;
    string code_type = 8;
}

message DelInfo {
    string block_key = 1;
}