syntax = "proto3";

package coordinator_proto;

// The greeting service definition.
service coordinatorService {
  // Sends a greeting
  rpc sayHelloToCoordinator (RequestToCoordinator) returns (ReplyFromCoordinator) {};
  rpc checkalive (RequestToCoordinator) returns (ReplyFromCoordinator) {};

  // set parameters of metadata
  rpc setParameter(Parameter) returns (RepIfSetParaSuccess) {};

  // set
  rpc uploadOriginKeyValue (RequestProxyIPPort) returns (ReplyProxyIPPort) {};
  rpc reportCommitAbort (CommitAbortKey) returns (ReplyFromCoordinator) {}; //from proxy
  rpc checkCommitAbort (AskIfSuccess) returns (RepIfSuccess) {};  //from client
  rpc uploadSetValue (RequestProxyIPPort) returns (ReplyProxyIPsPorts) {};
  rpc uploadSubsetValue (RequestProxyIPPort) returns (ReplyProxyIPsPorts) {};
  // append
  rpc uploadAppendValue (RequestProxyIPPort) returns (ReplyProxyIPsPorts) {};
  // xue update
  rpc uploadXueUpdate (XueUpdateRequest) returns (ReplyProxyIPsPorts) {};
  // xue strict schedule: ingress barrier + per-step DAG (replaces wave release when steps present)
  rpc reportXueIngressReady (XueIngressReadyReport) returns (ReplyFromCoordinator) {};
  rpc waitXueAllIngressReady (XueStripeScheduleId) returns (ReplyFromCoordinator) {};
  rpc waitXueAllCommitsReady (XueStripeScheduleId) returns (ReplyFromCoordinator) {};
  rpc waitXueScheduleStep (XueScheduleStepWait) returns (ReplyFromCoordinator) {};
  rpc reportXueScheduleStepDone (XueScheduleStepDone) returns (ReplyFromCoordinator) {};
  // legacy wave/hop barriers (fallback when xue_transfer_steps empty)
  rpc releaseXueScheduleWave (XueScheduleWaveRelease) returns (ReplyFromCoordinator) {};
  rpc waitXueScheduleHop (XueScheduleHopWait) returns (ReplyFromCoordinator) {};
  // xue update timing (cluster pure xfer aggregation)
  rpc pullXueXferTiming (XueXferTimingPull) returns (XueXferTimingSummary) {};
  // get
  rpc getValue(KeyAndClientIP) returns (RepIfGetSuccess) {};

  rpc getStripe(KeyAndClientIP) returns (ReplyProxyIPsPorts) {};

  rpc getBlocks(BlockIDsAndClientIP) returns (ReplyProxyIPsPorts) {};

  rpc getDegradedReadBlocks(BlockIDsAndClientIP) returns (ReplyProxyIPsPorts) {};

  // degraded read
  rpc getDegradedReadBlock(KeyAndClientIP) returns (DegradedReadReply) {};
  rpc getDegradedReadBlockBreakdown(KeyAndClientIP) returns (DegradedReadReply) {};
  // recovery
  rpc getRecovery(KeyAndClientIP) returns (RecoveryReply) {};
  rpc getRecoveryBreakdown(KeyAndClientIP) returns (RecoveryReply) {};
  rpc fullNodeRecovery(NodeIdFromClient) returns (RepBlockNum) {};
  rpc multiBlockRecovery(StripeIdAndBlockIDsFromClient) returns (RecoveryReply) {};
  // delete
  rpc delByKey(KeyFromClient) returns (RepIfDeling) {};
  rpc delByStripe(StripeIdFromClient) returns (RepIfDeling) {};

  //other
  rpc listStripes(RequestToCoordinator) returns (RepStripeIds) {};
  rpc decodeTest(KeyAndClientIP) returns (DegradedReadReply) {};
}

message Parameter {
  bool partial_decoding = 1;
  int32 encodetype = 2;
  int32 s_stripe_placementtype = 3;
  int32 m_stripe_placementtype = 4;
  int32 k_datablock = 5;
  int32 l_localparityblock = 6;
  int32 g_m_globalparityblock = 7;
  int32 b_datapergroup = 8;
  int32 x_stripepermergegroup = 9;
}

message RepIfSetParaSuccess {
  bool ifsetparameter = 1;
}

// The request message containing the user's name.
message RequestToCoordinator {
  string name = 1;
}

// The response message containing the greetings
message ReplyFromCoordinator {
  string message = 1;
}

// set
message RequestProxyIPPort {
  string key = 1;
  uint64 valuesizebytes = 2;
  string append_mode = 3;
}

message ReplyProxyIPPort {
  string proxyip = 1;
  int32 proxyport = 2;
}

message CommitAbortKey {
  string key = 1;
  bool ifcommitmetadata = 2;
  int32 opp = 3;
  int32 stripe_id = 4;
}

// append
message AppendPlanLayout {
  int32 group_id = 1;
  int32 cluster_id = 2;
  int32 data_block_num = 3;
  int32 global_parity_block_num = 4;
  int32 local_parity_block_num = 5;
  repeated int32 block_ids = 6;
  // 与 cluster TCP payload 中 slice 顺序一一对应（block_id/offset/size）
  repeated int32 slice_block_ids = 7;
  repeated int32 slice_offsets = 8;
  repeated int32 slice_sizes = 9;
}

// Strict XUE schedule: one row per scheduled_tasks hop (step_no 1-based, parallel_group = same start_time)
message XueTransferStepInfo {
  int32 step_no = 1;
  int32 parallel_group = 2;
  string append_key = 3;
  int32 from_cluster = 4;
  int32 to_cluster = 5;
  string payload = 6;
  string path_desc = 7;
  double start_time = 8;
  repeated int32 pred_step_nos = 9;
  // proxy forward_append_mode: XUE_DELTA_TO_RELAY / XUE_DELTA_TO_GLOBAL / ...
  string forward_append_mode = 10;
}

message XueStripeScheduleId {
  int32 stripe_id = 1;
}

message XueIngressReadyReport {
  int32 stripe_id = 1;
  string append_key = 2;
}

message XueScheduleStepWait {
  int32 stripe_id = 1;
  int32 step_no = 2;
  string append_key = 3;
  int32 from_cluster = 4;
  int32 to_cluster = 5;
  uint64 xue_xfer_plan_id = 6;
}

message XueScheduleStepDone {
  int32 stripe_id = 1;
  int32 step_no = 2;
  bool success = 3;
  string append_key = 4;
  int32 from_cluster = 5;
  int32 to_cluster = 6;
  uint64 xue_xfer_plan_id = 7;
}

// Legacy wave schedule (client ingress waves + proxy hop release)
message XueScheduleClientWave {
  int32 wave_index = 1;
  repeated string client_ingress_append_keys = 2;
}

message XueAppendKeyCommitWave {
  string append_key = 1;
  int32 wait_commit_wave = 2;
}

message XueScheduleWaveRelease {
  int32 stripe_id = 1;
  int32 released_wave = 2;
}

message XueScheduleHopWait {
  int32 stripe_id = 1;
  string append_key = 2;
  int32 from_cluster = 3;
  int32 to_cluster = 4;
}

message ReplyProxyIPsPorts {
  uint64 sum_append_size = 1;
  repeated string append_keys = 2;
  repeated string proxyips = 3;
  repeated int32 proxyports = 4;
  repeated uint64 cluster_slice_sizes = 5;
  repeated int32 group_ids = 6;
  repeated AppendPlanLayout plan_layouts = 7;
  repeated XueScheduleClientWave xue_client_waves = 8;
  repeated XueAppendKeyCommitWave xue_commit_waves = 9;
  int32 xue_schedule_stripe_id = 10;
  repeated XueTransferStepInfo xue_transfer_steps = 11;
  int32 xue_schedule_num_groups = 12;
  // correlates client/proxy timing samples for one XUE update round
  uint64 xue_xfer_plan_id = 13;
}

message XueXferTimingPull {
  int32 stripe_id = 1;
  uint64 xue_xfer_plan_id = 2;
}

message XueXferTimingProxySample {
  int32 cluster_id = 1;
  double proxy_pure_xfer_sec = 2;
  int64 wall_span_start_unix_ms = 3;
  int64 wall_span_end_unix_ms = 4;
}

message XueXferTimingSummary {
  repeated XueXferTimingProxySample proxies = 1;
  double max_proxy_pure_xfer_sec = 2;
  double cluster_pure_xfer_span_wall_sec = 3;
}

// set, del, merge
message AskIfSuccess {
  string key = 1;
  int32 opp = 2;
  int32 stripe_id = 3;
}

message RepIfSuccess {
  bool ifcommit = 1;
}

// get
message KeyAndClientIP {
  string key = 1;
  string clientip = 2;
  int32 clientport = 3;
}
message RepIfGetSuccess {
  bool ifgetsuccess = 1;
  int32 valuesizebytes = 2;
}
message BlockIDsAndClientIP{
  int32 start_block_id = 1;
  int32 end_block_id = 2;
  string clientip = 3;
  int32 clientport = 4;
  int32 failed_block_id = 5;
}

message LogicalRange {
  int32 logical_offset_start = 1;
  int32 logical_offset_end = 2;
}

message XueUpdateRequest {
  string client_id = 1;
  int32 stripe_id = 2;
  // 多个不连续逻辑区间，均在同一条带内
  repeated LogicalRange ranges = 3;
}

// delete
message KeyFromClient {
  string key = 1;
}

message StripeIdFromClient {
  int32 stripe_id = 1;
}

message StripeIdAndBlockIDsFromClient {
  int32 stripe_id = 1;
  repeated int32 block_ids = 2;
}

message NodeIdFromClient {
  int32 node_id = 1;
}

message RepIfDeling {
  bool ifdeling = 1;
}

message RepStripeIds {
  repeated int32 stripe_ids = 1;
}

message RepBlockNum {
  int32 block_num = 1;
}

message DegradedReadReply {
  double disk_io_time = 1;
  double network_time = 2;
  double decode_time = 3;
  double grpc_start_time = 4;
}

message RecoveryReply {
  double disk_read_time = 1;
  double network_time = 2;
  double decode_time = 3;
  double disk_write_time = 4;
  double grpc_start_time = 5;
}
