syntax = "proto3";

package proxy_proto;

// The greeting service definition.
service proxyService {
  // Sends a greeting
  rpc checkalive (CheckaliveCMD) returns (RequestResult);

  // encode and set
  rpc encodeAndSetObject(ObjectAndPlacement) returns (SetReply);
  // get and decode
  rpc decodeAndGetObject(ObjectAndPlacement) returns (GetReply);
  // degraded read
  rpc degradedRead(DegradedReadRequest) returns (DegradedReadReply);
  rpc degradedRead2Client(RecoveryRequest) returns (DegradedReadReply);
  rpc degradedReadBreakdown(DegradedReadRequest) returns (DegradedReadReply);
  rpc degradedRead2ClientBreakdown(RecoveryRequest) returns (DegradedReadReply);
  rpc degradedReadWithBlockStripeID(DegradedReadRequest) returns (GetReply);
  rpc partialDecoding(PartialDecodingRequest) returns (DegradedReadReply);
  // recovery
  rpc recovery(RecoveryRequest) returns (RecoveryReply);
  rpc recoveryBreakdown(RecoveryRequest) returns (RecoveryReply);
  rpc multipleRecovery(MultipleRecoveryRequest) returns (GetReply);
  // delete
  rpc deleteBlock(NodeAndBlock) returns (DelReply);
  // append
  rpc scheduleAppend2Datanode(AppendStripeDataPlacement) returns (SetReply);
  // Parix
  rpc parixScheduleDataUpdate(ParixDataUpdatePlacement) returns (ParixScheduleDataUpdateReply);
  rpc parixJournalAppend(ParixJournalAppendRequest) returns (ParixJournalAppendReply);
  // 同一 parity proxy 上多个 parity_block 共享一次 new_payload，避免重复传输
  rpc parixJournalAppendBatch(ParixJournalAppendBatchRequest) returns (ParixJournalAppendBatchReply);
  rpc parixSupplyD0(ParixSupplyD0Request) returns (SetReply);
  rpc parixReplayBatch(ParixReplayBatchRequest) returns (SetReply);
  // Coordinator pulls aggregated xfer timing for a batch (consume-on-read).
  rpc parixPullBatchXferTiming(ParixReplayBatchRequest) returns (ParixBatchXferTimingReply);
  rpc parixParityFullOverwrite(ParixParityFullOverwriteRequest) returns (SetReply);
  // get stripe
  rpc getBlocks(StripeAndBlockIDs) returns (GetReply);
}

// parity block recalculation
message locationInfo {
  int32 cluster_id = 1;
  string proxy_ip = 2;
  int32 proxy_port = 3;
  repeated string datanodeip = 4;
  repeated int32 datanodeport = 5;
  repeated string blockkeys = 6;
  repeated int32 blockids = 7;
}

message mainRecalPlan {
  bool type = 1;  // to distinguish local and global
  bool if_partial_decoding = 2;
  repeated locationInfo clusters = 3;
  repeated string p_datanodeip = 4;
  repeated int32 p_datanodeport = 5;
  repeated string p_blockkeys = 6;
  int32 k = 7;
  int32 l = 8;
  int32 g_m = 9;
  int32 block_size = 10;
  int32 encodetype = 11;
  int32 stripe_id = 12;
  int32 group_id = 13;
}

message RecalReply {
  string result = 1;
}

message helpRecalPlan {
  bool type = 1;
  bool if_partial_decoding = 2;
  string mainproxyip = 3;
  int32 mainproxyport = 4;
  repeated string datanodeip = 5;
  repeated int32 datanodeport = 6;
  repeated string blockkeys = 7;
  int32 block_size = 8;
  repeated int32 blockids = 9;
  int32 parity_num = 10;
  int32 k = 11;
  int32 encodetype = 12;
}

// block relocation
message blockRelocPlan {
  repeated string blocktomove = 1;
  repeated string fromdatanodeip = 2;
  repeated int32 fromdatanodeport = 3;
  repeated string todatanodeip = 4;
  repeated int32 todatanodeport = 5;
  int32 block_size = 6;
}

message blockRelocReply {
  string result = 1;
}

message AskIfSuccess {
  int32 step = 1;
}

message RepIfSuccess {
  bool ifsuccess = 1;
}

// delete
message NodeAndBlock {
  repeated string blockkeys = 1;
  repeated string datanodeip = 2;
  repeated int32 datanodeport = 3;
  int32 stripe_id = 4;
  string key = 5;
}

message DelReply {
  bool ifcommit = 1;
}

// The request message containing the user's name.
message CheckaliveCMD {
  string name = 1;
}

// The response message containing the greetings
message RequestResult {
  bool message = 1;
}

// set and get
message ObjectAndPlacement{
  string key = 1;
  int32 valuesizebyte = 2;
  int32 k = 3;
  int32 l = 4;
  int32 g_m = 5;
  int32 stripe_id = 6;
  repeated string datanodeip = 7;
  repeated int32 datanodeport = 8;
  repeated string blockkeys = 9;
  repeated int32 blockids = 10;
  int32 block_size = 11;
  int32 encode_type = 12;
  string clientip = 13;
  int32 clientport = 14;
}

// degraded read
message DegradedReadRequest{
  string clientip = 1;
  int32 clientport = 2;
  int32 failed_block_id = 3;
  int32 failed_block_stripe_id = 4;
  string failed_block_key = 5;
  repeated string datanodeip = 6;
  repeated int32 datanodeport = 7;
  repeated string blockkeys = 8;
  repeated int32 blockids = 9;
}

message PartialDecodingRequest{
  string dest_ip = 1;
  int32 dest_port = 2;
  repeated int32 source_block_ids = 3;
  repeated string source_block_keys = 4;
  repeated string source_datanode_ips = 5;
  repeated int32 source_datanode_ports = 6;
  int32 decode_num = 7;
  repeated int32 decode_factors = 8;
}

message DegradedReadReply {
  double disk_io_start_time = 1;
  double disk_io_end_time = 2;
  double network_start_time = 3;
  double network_end_time = 4;
  double decode_start_time = 5;
  double decode_end_time = 6;
  double cross_rack_time = 7;
  double cross_rack_xor_time = 8;
  double grpc_start_time = 9;
  double data_node_grpc_notify_time = 10;
  double data_node_grpc_start_time = 11;
}

// recovery
message RecoveryRequest{
  string replaced_node_ip = 1;
  int32 replaced_node_port = 2;
  int32 failed_block_id = 3;
  string failed_block_key = 4;
  int32 cross_rack_num = 5;
  repeated string datanodeip = 6;
  repeated int32 datanodeport = 7;
  repeated string blockkeys = 8;
  repeated int32 blockids = 9;
  repeated string proxyip = 10;
  repeated int32 proxyport = 11;
  bool is_to_send_block_id = 12;
  int32 block_id_to_send = 13;
}

message MultipleRecoveryRequest{
  string replacing_node_ip = 1;
  int32 replacing_node_port = 2;
  repeated int32 failed_block_ids = 3;
  repeated string failed_block_keys = 4;
  int32 cross_rack_num = 5;
}

message RecoveryReply {
  double disk_io_start_time = 1;
  double disk_io_end_time = 2;
  double network_start_time = 3;
  double network_end_time = 4;
  double decode_start_time = 5;
  double decode_end_time = 6;
  double cross_rack_time = 7;
  double cross_rack_xor_time = 8;
  double grpc_start_time = 9;
  double data_node_grpc_notify_time = 10;
  double data_node_grpc_start_time = 11;
  double dest_data_node_network_time = 12;
  double dest_data_node_disk_io_time = 13;
  
}

enum ParixParityAck {
  PARIX_ACK_SUCCESS = 0;
  PARIX_ACK_NEED_D0 = 1;
}

message ParixParityRpcTarget {
  string proxy_ip = 1;
  int32 proxy_grpc_port = 2;
  int32 parity_block_id = 3;
  string parity_block_key = 4;
  string parity_datanode_ip = 5;
  int32 parity_datanode_port = 6;
}

message ParixDataUpdatePlacement {
  string key = 1;
  int32 stripe_id = 2;
  uint64 batch_id = 3;
  uint64 write_generation = 4;
  int32 cluster_id = 5;
  string block_key = 6;
  int32 block_id = 7;
  int32 range_offset = 8;
  uint64 range_length = 9;
  string datanode_ip = 10;
  int32 datanode_port = 11;
  repeated ParixParityRpcTarget global_parities = 12;
  ParixParityRpcTarget local_parity = 13;
}

message ParixJournalAckItem {
  string parity_proxy_ip = 1;
  int32 parity_proxy_grpc_port = 2;
  int32 parity_block_id = 3;
  ParixParityAck ack = 4;
}

message ParixScheduleDataUpdateReply {
  bool ifcommit = 1;
  repeated ParixJournalAckItem journal_acks = 2;
}

message ParixJournalAppendRequest {
  int32 stripe_id = 1;
  uint64 batch_id = 2;
  uint64 write_generation = 3;
  int32 parity_block_id = 4;
  string parity_block_key = 5;
  string parity_datanode_ip = 6;
  int32 parity_datanode_port = 7;
  int32 data_block_id = 8;
  int32 range_offset = 9;
  uint64 range_length = 10;
  bytes new_payload = 11;
}

message ParixJournalAppendReply {
  ParixParityAck ack = 1;
}

message ParixJournalAppendBatchItem {
  int32 parity_block_id = 1;
  string parity_block_key = 2;
  string parity_datanode_ip = 3;
  int32 parity_datanode_port = 4;
}

message ParixJournalAppendBatchRequest {
  int32 stripe_id = 1;
  uint64 batch_id = 2;
  uint64 write_generation = 3;
  int32 data_block_id = 4;
  int32 range_offset = 5;
  uint64 range_length = 6;
  bytes new_payload = 7;
  repeated ParixJournalAppendBatchItem targets = 8;
}

message ParixJournalAppendBatchAckItem {
  int32 parity_block_id = 1;
  ParixParityAck ack = 2;
}

message ParixJournalAppendBatchReply {
  // 与 request.targets 顺序一致
  repeated ParixJournalAppendBatchAckItem acks = 1;
}

message ParixSupplyD0Request {
  int32 stripe_id = 1;
  uint64 batch_id = 2;
  uint64 write_generation = 3;
  int32 parity_block_id = 4;
  int32 data_block_id = 5;
  int32 range_offset = 6;
  uint64 range_length = 7;
  bytes old_payload = 8;
}

message ParixReplayBatchRequest {
  int32 stripe_id = 1;
  uint64 batch_id = 2;
}

message ParixBatchXferTimingReply {
  bool had_samples = 1;
  double proxy_pure_xfer_sec = 2;
  int64 wall_span_start_unix_ms = 3;
  int64 wall_span_end_unix_ms = 4;
}

message ParixJournalInvalidationRange {
  int32 data_block_id = 1;
  int32 range_offset = 2;
  uint64 range_length = 3;
}

message ParixParityFullOverwriteRequest {
  int32 stripe_id = 1;
  uint64 new_write_generation = 2;
  int32 parity_block_id = 3;
  string parity_block_key = 4;
  bytes full_parity_block = 5;
  string datanode_ip = 6;
  int32 datanode_port = 7;
  // 仅删除与该列表中任一区间相交的日志；为空则只写校验块、不删任何日志。
  repeated ParixJournalInvalidationRange journal_invalidations = 8;
}

// append
message AppendStripeDataPlacement{
  string key = 1;
  int32 cluster_id = 2;
  int32 stripe_id = 3;
  // sum of all append slices within the cluster
  uint64 append_size = 4;
  repeated string datanodeip = 5;
  repeated int32 datanodeport = 6;
  repeated string blockkeys = 7;
  repeated int32 blockids = 8;
  // physical offset of each append slice within each block
  repeated uint64 offsets = 9;
  repeated uint64 sizes = 10;
  bool is_merge_parity = 11;
  string append_mode = 12;
  bool is_serialized = 13;
}

message SetReply {
  bool ifcommit = 1;
}
message GetReply {
  bool getsuccess = 1;
}
message StripeAndBlockIDs{
  int32 stripe_id = 1;
  int32 group_id = 2;
  string clientip = 3;
  int32 clientport = 4;
  repeated int32 block_ids = 5;
  repeated string block_keys = 6;
  repeated string datanodeips = 7;
  repeated int32 datanodeports = 8;
}